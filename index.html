<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테스트 페이지</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f6f8;
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #111;
    }

    p {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      width: 100%;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .result-box {
      margin-top: 1.5rem;
      padding: 0.85rem;
      background-color: #eff6ff;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1e40af;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>테스트 화면</h1>
    <p>Plip Front Test Page</p>
    
    <button class="btn" onclick="handleTestClick()">클릭</button>
    
    <div id="result" class="result-box">
      클릭 횟수: 0회
    </div>
  </div>

  <script>
    let count = 0;

    function handleTestClick() {
      count++;
      const resultElement = document.getElementById('result');
      resultElement.innerText = `클릭 횟수: ${count}회`;
    }
  </script>

</body>
</html>
